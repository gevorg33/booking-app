# Production stack: nginx + local frontend/backend (see deploy/SUBDOMAIN.md)
# Usage:
#   cp deploy/env.production.example deploy/.env.production
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-booking_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-booking_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: https://${BOOKING_ROOT_DOMAIN},https://*.${BOOKING_ROOT_DOMAIN}
      ROOT_DOMAIN: ${BOOKING_ROOT_DOMAIN}
      FRONTEND_URL: https://${BOOKING_ROOT_DOMAIN}
      PUBLIC_API_URL: https://api.${BOOKING_ROOT_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3001'

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${BOOKING_ROOT_DOMAIN}
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_ROOT_DOMAIN: ${BOOKING_ROOT_DOMAIN}
    depends_on:
      - backend
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/booking.rendered.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
