# Production nginx — tenant subdomains (business slug) + API
# Replace BOOKING_ROOT_DOMAIN (e.g. example.com) before use.
# See deploy/SUBDOMAIN.md and deploy/docker-compose.prod.yml

map $host $booking_tenant_slug {
    default "";
    # api.example.com and www.example.com are not tenant slugs
    ~^(?<slug>[^.]+)\.BOOKING_ROOT_DOMAIN$ $slug;
}

# Treat reserved hostnames as non-tenant (dashboard/apex use root app routes)
map $booking_tenant_slug {
    default $booking_tenant_slug;
    api     "";
    www     "";
}

upstream booking_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream booking_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name BOOKING_ROOT_DOMAIN *.BOOKING_ROOT_DOMAIN;
    return 301 https://$host$request_uri;
}

# API — api.BOOKING_ROOT_DOMAIN
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.BOOKING_ROOT_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://booking_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# Tenant subdomains — gloss.BOOKING_ROOT_DOMAIN → frontend (middleware rewrites to /book/gloss/)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.BOOKING_ROOT_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Optional: pass tenant slug to upstream for logging
    proxy_set_header X-Tenant-Slug $booking_tenant_slug;

    location / {
        proxy_pass http://booking_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Apex — dashboard, login, marketing (BOOKING_ROOT_DOMAIN)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name BOOKING_ROOT_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    location / {
        proxy_pass http://booking_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
