# nginx when frontend is on Vercel and API on Railway (or any external HTTPS upstream)
# Replace placeholders before use:
#   BOOKING_ROOT_DOMAIN   e.g. example.com
#   BOOKING_FRONTEND_UPSTREAM  e.g. frontend-sand-six-17.vercel.app
#   BOOKING_API_UPSTREAM       e.g. booking-api-production.up.railway.app

map $host $booking_tenant_slug {
    default "";
    ~^(?<slug>[^.]+)\.BOOKING_ROOT_DOMAIN$ $slug;
}

map $booking_tenant_slug {
    default $booking_tenant_slug;
    api     "";
    www     "";
}

server {
    listen 80;
    listen [::]:80;
    server_name BOOKING_ROOT_DOMAIN *.BOOKING_ROOT_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.BOOKING_ROOT_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass https://BOOKING_API_UPSTREAM;
        proxy_ssl_server_name on;
        proxy_set_header Host BOOKING_API_UPSTREAM;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name BOOKING_ROOT_DOMAIN *.BOOKING_ROOT_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    proxy_set_header X-Tenant-Slug $booking_tenant_slug;

    location / {
        proxy_pass https://BOOKING_FRONTEND_UPSTREAM;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
