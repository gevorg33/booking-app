name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # e2e-bug.449 — the `backend-tests` job was retired on 2026-08-25.
  #
  # It ran `npm test`, i.e. plain `jest` over the whole backend, which **cannot
  # pass** while the known-failures manifest is non-empty (84 tests as of this
  # commit). A required check that is red by construction gates nothing; worse,
  # it teaches everyone that a red X on this workflow is the normal state, which
  # is exactly the condition under which a real regression goes unnoticed.
  #
  # Nothing is lost by removing it, because `ai-known-failures` below runs the
  # identical work and actually judges it. Verified rather than assumed:
  #   - `npm test` is bare `jest`; the sweep runs the same binary with
  #     `--testPathPatterns=src/`, and `rootDir` is `src`, so both select every
  #     `*.spec.ts` in the backend.
  #   - The sweep deliberately does not pass `--runInBand`, so it uses the same
  #     default parallelism `npm test` did — the manifest stays calibrated to
  #     the scheduling CI actually produces.
  #   - Both go through the same ts-jest transform, so spec-side compilation is
  #     still exercised. Production typechecking is `npm run typecheck` in
  #     `ai-gates`, which is stricter than anything `npm test` was doing.
  #
  # The difference is only in the verdict: `npm test` said "84 tests are red"
  # every single run, while the sweep says "the red set changed", which is the
  # thing worth failing a build over.
  #
  # NOTE: "Backend tests" must also be removed from branch protection's required
  # status checks. GitHub blocks merges waiting on a required check that no
  # longer reports, so leaving it listed there is worse than the red X was.

  # e2e-bug.449 / AI-ROADMAP §191. These gates were only ever run by hand, so
  # nothing enforced them between commits. They are a separate job from
  # `backend-tests` on purpose: that job runs plain `jest` over the whole
  # backend, which cannot pass while known failures remain (203 as of §205, see
  # e2e-bug.471), so gates added beside it would never be reached. Each gate is its own step so a red run
  # names the gate that broke rather than "the AI job".
  ai-gates:
    name: AI roadmap gates
    runs-on: ubuntu-latest
    # The sweep was measured at 316 s idle, 691 s covering the whole backend,
    # and 1025 s on a loaded machine, so the headroom is for a slow runner
    # rather than the happy path.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # F1 / e2e-bug.359 — persist ts-jest's transform cache across runs.
      #
      # `cache: npm` above is setup-node's *dependency* cache and does nothing
      # for transforms, so every run recompiled the whole tree. Measured on this
      # job's first step: **cold 64.6 s vs warm 47.4 s**, a 17.3 s saving, and
      # the known-failures sweep below is a second jest invocation over the whole
      # backend where the same penalty was measured at 56 s.
      #
      # Keyed on the lockfile and tsconfig because those are what invalidate a
      # ts-jest transform; `restore-keys` lets a changed lockfile still start
      # from the previous cache rather than from nothing.
      - name: Cache jest transforms
        uses: actions/cache@v4
        with:
          path: backend/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'backend/tsconfig*.json') }}
          restore-keys: |
            jest-${{ runner.os }}-

      # F1 / e2e-bug.359 — the type check the repo can actually enforce.
      #
      # `tsc -p tsconfig.json` reports 1,431 errors, which is why no CI step
      # existed. Measured 2026-08-20: **all 1,431 are in `.spec.ts` files across
      # 394 specs; production code has zero.** So this gates `src/**` minus the
      # specs, which is green today and takes ~2 s locally.
      #
      # First step on purpose: 2 s of feedback beats 90 s when a type error is
      # what broke the build. The spec-side errors remain ungated — a separate
      # and much narrower job than the raw count implies, since they are
      # dominated by repeated jest-mock shapes that do not match TypeORM's
      # overloads.
      - name: Typecheck (production sources)
        env:
          CI: true
        run: npm run typecheck

      # ~90 s. Freeze, inventory, reachability, registry, permissions, the
      # declared-inputs rule, the re-parser ratchet, and the rest of the chain.
      - name: AI roadmap gate chain
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:ai-roadmap-gates

      # e2e-bug.454 — the lint ratchet. ~85 s.
      #
      # Lint was enforced nowhere: `eslint src` reported thousands of errors and
      # nothing failed, so errors accumulated freely. This does not demand zero
      # — the count is 5,853, of which **86% are `prettier/prettier`** and most
      # are auto-fixable. It demands that the number not grow.
      #
      # Deliberately not preceded by a repo-wide `--fix`: that would rewrite
      # 4,563 files, collide with anything in flight, and scatter `git blame`.
      # Collapsing the number is a one-commit job for a quiet moment; stopping
      # the growth is what has never been true.
      #
      # A failure here is usually `npm run lint` on the files you touched.
      - name: Lint ratchet
        env:
          CI: true
        run: npm run lint:ratchet

      # The 8,464-case deterministic corpus plus the accuracy ratchet. This is
      # the gate e2e-bug.449 was filed about. Runs before the sweep because it
      # is ~1 min against the sweep's 5-17, and failing fast on the cheap,
      # high-signal gate beats waiting on the long one.
      - name: AI deterministic accuracy gate
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:ai-accuracy

  # e2e-bug.474 / F1 — split out of `ai-gates` on 2026-08-20, which is the fix
  # that ticket names for itself: *"if it proves noisy here, the fix is to split
  # it into its own job rather than to loosen the comparison — the exactness is
  # the point."* It had already failed once when chained straight after the gate
  # chain on a loaded machine, while passing twice standalone (316 s and 1025 s),
  # so contention was the difference, not the assertion.
  #
  # Two things follow from the split. The sweep no longer inherits whatever the
  # gate chain left on the runner, and it runs *beside* the gates rather than
  # after them, so the job's wall-clock is now max(gates, sweep) instead of the
  # sum.
  ai-known-failures:
    # F1 / e2e-bug.359 — sharded 2026-08-20.
    #
    # Sharding this gate is not a `--shard` passthrough. It compares the failure
    # set against the manifest **exactly, in both directions**, so a slice judged
    # on its own reports every other slice's known failures as silent fixes. The
    # run and the comparison are therefore split: each shard writes its failure
    # map as an artifact, and `ai-known-failures-merge` unions them and does the
    # single comparison.
    #
    # Verified before wiring: a 2-way shard merged to **63 suites · 200 tests ·
    # ✓ exact match**, identical to the unsharded sweep's verdict on the same
    # tree.
    name: AI known-failures shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel siblings on one red shard: the merge job needs every
      # slice, and a missing artifact is refused rather than treated as "no
      # failures there".
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Was 45 for the whole sweep; a quarter of the work, with headroom for a
    # slow runner (the sweep spanned 316-1025 s depending on load).
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same transform cache as `ai-gates`, same key on purpose: whichever job
      # populates it first, the other restores it. See F1/e2e-bug.359 — the cold
      # penalty on a full-backend jest invocation was measured at 56 s.
      - name: Cache jest transforms
        uses: actions/cache@v4
        with:
          path: backend/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'backend/tsconfig*.json') }}
          restore-keys: |
            jest-${{ runner.os }}-

      # "Red means red": the failure set must match the manifest exactly, so a
      # newly broken test fails here even though `npm test` is already red — and
      # a newly *fixed* one fails too until the manifest is updated.
      #
      # As of §205 this covers the **whole backend** (`src/`), not just the AI
      # modules. That makes this job, not `backend-tests`, the one that actually
      # gates the backend: `npm test` there runs the same suites but cannot pass
      # while 203 known failures remain, so it reports nothing.
      - name: AI known-failures shard
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
        run: node ../scripts/ai-known-failures-gate.mjs --shard=${{ matrix.shard }}/4 --out=../shard-results/${{ matrix.shard }}.json

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: known-failures-shard-${{ matrix.shard }}
          path: shard-results/${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  # The single comparison, once every slice has reported.
  #
  # No `npm ci` here on purpose: in merge mode the gate reads JSON and the
  # manifest and never spawns jest, so it needs the repo and node, nothing else.
  ai-known-failures-merge:
    name: AI known-failures (merge + gate)
    runs-on: ubuntu-latest
    needs: ai-known-failures
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: known-failures-shard-*
          path: shard-results
          merge-multiple: true

      # Refuses to gate if the slices overlap, disagree on the shard count, or
      # one is missing — each of which would otherwise read as a set of fixes.
      - name: Compare merged failure set against the manifest
        run: node scripts/ai-known-failures-gate.mjs --merge=shard-results

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm test
        env:
          CI: true
        run: npm test

  consumer-app-tests:
    name: Consumer app tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: consumer-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: consumer-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm test
        env:
          CI: true
        run: npm test

  provider-app-tests:
    name: Provider app tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: provider-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: provider-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm test
        env:
          CI: true
        run: npm test
