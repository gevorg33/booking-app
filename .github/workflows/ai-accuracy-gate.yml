name: AI accuracy floor gate

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ai-accuracy-gate.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/ai-accuracy-gate.yml'

jobs:
  ai-accuracy:
    name: acc-2.9 deterministic accuracy floor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run AI accuracy gate
        run: npm run test:ai-accuracy

      - name: Run clarify follow-up eval gate (n99-1.9)
        run: npm run test:n99-1:gate

      - name: Run no-clarify completion eval gate (n99-2.9)
        run: npm run test:n99-2:gate
